name: 问题反馈
description: 反馈 Deskflow FileCopy 的文件复制或相关回归问题。
body:
  - type: markdown
    attributes:
      value: |
        这是 Deskflow FileCopy 非官方衍生项目的反馈入口。
        请使用[本项目发布页](https://github.com/EugeneEvan/deskflow-filecopy/releases)的版本，并先阅读[使用方式与限制](https://github.com/EugeneEvan/deskflow-filecopy#readme)。上游 Deskflow 的安装包不包含本扩展。
        请勿上传密码、Token、Cookie、证书私钥、完整环境配置或业务文件；日志和截图请先脱敏。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认问题发生在 Deskflow FileCopy，并已查找现有 Issue。
          required: true
        - label: 我已阅读 README 中的平台、功能和缓存限制。
          required: true
  - type: textarea
    id: versions
    attributes:
      label: 两端版本与运行模式
      description: 分别填写 Windows 版本、FileCopy 发布版本、帮助菜单中显示的 Deskflow 版本，以及服务端/客户端和 Desktop/Service 模式。无需提供真实计算机名或 IP。
      placeholder: |
        A：Windows 11，FileCopy 0.1.0，Deskflow 版本信息，服务端，Desktop
        B：Windows 10，FileCopy 0.1.0，Deskflow 版本信息，客户端，Desktop
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 使用的程序包
      options:
        - 本仓库 Release 安装程序 EXE
        - 本仓库 Release 便携 ZIP
        - 自行编译
        - 混用或其他来源（请在下方说明）
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: 连接与文件复制设置
      description: 文件复制问题请说明两端 TLS、文件复制开关及服务端剪贴板共享是否开启；其他回归可写不适用。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 按顺序说明操作，包括复制方向、切换时机以及何时粘贴。
      placeholder: |
        1. 在 A 复制……
        2. B 显示……
        3. 在 B 的目标文件夹按 Ctrl+V……
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 预期结果与实际结果
      description: 请写出完整错误提示，区分未传输、传输失败、缓存已就绪但粘贴失败等情况。
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 文件与目录情况
      description: 说明数量、总大小、是否有空目录/中文路径/同名顶层项目/符号链接；不需要上传原始文件。
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏日志与补充信息
      description: 仅提供必要时间段的日志或可复现样例，不要粘贴完整设置文件、TLS 私钥或业务内容。
